[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vec-slim"
version = "1.0.0"
description = "Scorer-aware H5AD slimming for Virtual Embryo Challenge submission files."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "anndata>=0.10",
  "scipy>=1.10",
  "pandas>=2.0"
]
keywords = ["virtual-embryo", "h5ad", "anndata", "compression"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vec-slim = "vec_slim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
